# ##########################################################################################################################################
# >> Ignore Game Lights
#
# :: Disables the translation of the listed game lights to remix lights
# :: Lights are identified by a hash. World lights hash their position and need to stand still.
#    Cutscene lights (cutscene + light name) and vehicle head / rear lights (model + light) keep their hash while moving.
#
# :: How to edit:
#    > Light Editor (GUI -> Map Settings -> Light Tweaks -> Open Light Editor)
#    > Right click a light -> Ignore light. Save in the editor's toolbar
#
# ~~ IGNORE_LIGHTS = [
#     0x0, 0x1, 0x2, ...            [uint array - hex format]
# ]

