# ##########################################################################################################################################
# >> Allow Game Lights
#
# :: Whitelists filler lights, only useful if 'ignore filler lights' is enabled
#
# :: How to edit:
#    > Light Editor: right click a filler light -> Allow filler light
#
# ~~ ALLOW_LIGHTS = [
#     0x0, 0x1, 0x2, ...            [uint array - hex format]
# ]

ALLOW_LIGHTS = [
    0x8C8CB2FC
]



# ##########################################################################################################################################
# >> Light Overrides
#
# :: Overrides settings of game lights and attaches additional lights to them
#
# :: How to edit:
#    > Light Editor: select a light in the world or in the list, create an override and tweak it
#
# :: Notes:
#    > Categories: group related overrides (optional)
#    > Attached lights: additional lights that exist as long as their base light does
#    > Priority: files are processed in alphabetical order (earlier files have higher priority)
#    > Comments: the comment above an entry is kept and shown as the name of the light
#
# ~~ LIGHT_OVERRIDES = [
#   {
#       #                   comment
#       hash =              hash of light                                   [uint - hex format]
#       pos = []            position of light                        [opt.] [3D Vector]
#       dir = []            direction of light                       [opt.] [3D Vector]
#       color = []          color of light                           [opt.] [3D Vector]
#       radius =            radius of light                          [opt.] [Float]
#       intensity =         intensity of light                       [opt.] [Float]
#       outer_cone_angle =  cosine of the outer cone angle           [opt.] [Float]
#       inner_cone_angle =  cosine of the inner cone angle           [opt.] [Float]
#       volumetric_scale =  volumetric scale of light                [opt.] [Float]
#       light_type =        false: sphere -- true: spotlight         [opt.] [Bool]
#                           or "rect", "disk", "cylinder"                [opt.] [String]
#       size = []           rect: side lengths -- disk: radii        [opt.] [2D Vector]
#       length =            length of a cylinder (radius = its tube) [opt.] [Float]
#       roll =              rect / disk: degrees around dir          [opt.] [Float]
#       attached = [        attached lights for this hash            [opt.] [Array of light override structures]
#       { ... light override }, { ... }]
#   },
#   {
#       category =          category name                                   [String]
#       overrides = [       light overrides                                 [Array of light override structures]
#       { ... light override }, { ... }]
#   },
# ]

